# Builds the game with Vite and publishes it to the `gh-pages` branch each time `main` is pushed.
#
# One-time setup on github.com (after the first successful run has created the gh-pages branch):
#   Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch" -> Branch: gh-pages, folder: / (root).
# Variables: Settings -> Secrets and variables -> Actions -> "Variables" tab. Every variable whose name starts
# with VITE_ is handed to the build (contract addresses, VITE_RELAY_URL).
#
# Those values are baked into the public page. Never add a private key (DESCENT_OPERATOR_KEY) here.
# GitHub Pages only serves files: the online relay lives on Cloudflare (see docs/HUONG-DAN-CHOI-ONLINE.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# the built-in token only needs to push the gh-pages branch
permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Settings from repository variables
        env:
          REPO_VARS: ${{ toJSON(vars) }}
        run: |
          echo "$REPO_VARS" | jq -r 'to_entries[] | select(.key | startswith("VITE_")) | select(.value != "") | "\(.key)=\(.value)"' > .env.production.local
          echo "Passed to the build: $(cut -d= -f1 .env.production.local | tr '\n' ' ')"
      - name: Build
        # the page lives at https://<you>.github.io/<repository>/
        run: bun run build --base="/${{ github.event.repository.name }}/"
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
